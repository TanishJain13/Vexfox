name: Bug Report
description: Report a reproducible bug or unexpected behavior in Vexfox
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure sensitive credentials (API keys, authorization tokens) are redacted from any logs or cassette snippets you attach.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: |
        Provide a self-contained Python code snippet and cassette (if applicable) that reproduces the behavior.
      render: python
      placeholder: |
        import httpx
        import vexfox

        with vexfox.use_cassette("test_cassette.json"):
            ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics & Error Output
      description: Paste any terminal error tracebacks or `vexfox inspect` outputs here.
      render: text
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g., 3.11.8, 3.12.2"
    validations:
      required: true

  - type: input
    id: httpx-version
    attributes:
      label: HTTPX Version
      placeholder: "e.g., 0.27.0"
    validations:
      required: true
